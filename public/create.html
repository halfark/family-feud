<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vytvořit sadu / Create set</title>
<link rel="stylesheet" href="/style.css">
<style>
  .qblock{background:#0d1525;border:1px solid var(--line);border-radius:9px;padding:1rem;margin-bottom:1rem}
  .arow{display:grid;grid-template-columns:1fr 90px 34px;gap:.4rem;margin-bottom:.35rem;align-items:center}
  .drop{border:2px dashed var(--tile-line);border-radius:8px;padding:1.2rem;text-align:center;cursor:pointer;
    color:var(--muted);font-size:.92rem;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.05)}
  .xbtn{background:transparent;border:1px solid var(--line);color:var(--faint);border-radius:4px;
    cursor:pointer;padding:.35rem;font-size:.9rem}
  .xbtn:hover{border-color:var(--red-br);color:var(--red-br)}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="brand">Family Feud</span><span class="badge gold" data-i18n="cr_badge"></span>
  <nav class="nav" id="nav"></nav>
</div></div>

<div class="wrap" style="padding-top:1.5rem;padding-bottom:3rem;max-width:900px">
  <div id="gate" style="display:none"><div class="empty">
    <span data-i18n="cr_gate"></span></div></div>

  <div id="editor" style="display:none">
    <div class="card" style="margin-bottom:1.2rem">
      <div class="card-title" data-i18n="cr_info"></div>
      <div class="grid2">
        <div class="field"><label class="lbl" data-i18n="cr_title"></label>
          <input class="input" id="s-title" data-i18n-ph="cr_title_ph"></div>
        <div class="field"><label class="lbl" data-i18n="cr_topic"></label>
          <input class="input" id="s-topic" list="topics" data-i18n-ph="cr_topic_ph">
          <datalist id="topics"></datalist></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="lbl" data-i18n="cr_grade"></label>
          <select class="input" id="s-grade"></select></div>
        <div class="field"><label class="lbl" data-i18n="cr_lang"></label>
          <select class="input" id="s-lang" onchange="fillGrades()">
            <option value="cs">Čeština</option><option value="en">English</option>
          </select></div>
        <div class="field"><label class="lbl" data-i18n="cr_vis"></label>
          <select class="input" id="s-vis">
            <option value="public" data-i18n="cr_vis_pub"></option>
            <option value="private" data-i18n="cr_vis_priv"></option>
          </select></div>
      </div>
      <p style="font-size:.82rem;color:var(--muted);line-height:1.5">
        <span data-i18n="cr_mod_note"></span>
      </p>
    </div>

    <div class="card" style="margin-bottom:1.2rem">
      <div class="card-title" data-i18n="cr_import"></div>
      <div class="drop" id="drop" onclick="fileEl.click()" data-i18n="cr_drop"></div>
      <input type="file" id="file" accept=".json" style="display:none">
      <div style="display:flex;gap:.5rem;margin-top:.6rem">
        <button class="btn btn-ghost btn-sm" onclick="downloadTemplate()" data-i18n="cr_tpl"></button>
        <button class="btn btn-ghost btn-sm" onclick="exportCurrent()" data-i18n="cr_exp"></button>
      </div>
      <pre style="margin-top:.7rem;font-size:.75rem;color:var(--faint);background:#0a0f1a;padding:.7rem;
        border-radius:5px;border:1px solid var(--line);overflow-x:auto">{"title":"…","topic":"…","grade":"…","questions":[
  {"question":"Jmenuj…","answers":[{"text":"Pes","points":40},{"text":"Kočka","points":32}]}]}</pre>
    </div>

    <div id="qs"></div>

    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem">
      <button class="btn btn-ghost" onclick="addQuestion()" data-i18n="cr_addq"></button>
      <button class="btn btn-gold" style="flex:1;min-width:200px" onclick="save()" data-i18n="cr_submit"></button>
    </div>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
let QS = [];
const fileEl = document.getElementById('file');

function blankQ(){ return { question:'', answers:[{text:'',points:''},{text:'',points:''},{text:'',points:''}] }; }

const GRADES = {
  cs: ['1.–3. třída','4.–5. třída','6.–9. třída'],
  en: ['Grade 3–5 (A1)','Grade 6–7 (A1–A2)','Grade 8–9 (A2–B1)'],
};
function fillGrades(){
  const l = document.getElementById('s-lang').value;
  document.getElementById('s-grade').innerHTML =
    GRADES[l].map(g=>`<option>${escapeHtml(g)}</option>`).join('');
  loadTopics(l);
}
async function loadTopics(l){
  try{ const m = await api.get('/api/sets/meta?lang='+l);
    document.getElementById('topics').innerHTML = m.topics.map(x=>`<option value="${escapeHtml(x)}">`).join('');
  }catch{}
}

function renderQs(){
  document.getElementById('qs').innerHTML = QS.map((q,qi)=>`
    <div class="qblock">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem">
        <span style="font-family:'Bebas Neue';font-size:1.4rem;color:var(--gold)">${qi+1}</span>
        <input class="input" placeholder="${t('cr_qph')}" value="${escapeHtml(q.question)}"
          oninput="QS[${qi}].question=this.value">
        <button class="xbtn" onclick="QS.splice(${qi},1);renderQs()" title="${t('cr_delq')}">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 90px 34px;gap:.4rem;margin-bottom:.3rem">
        <span class="lbl" style="margin:0">${t('cr_answer')}</span><span class="lbl" style="margin:0">${t('cr_points')}</span><span></span>
      </div>
      ${q.answers.map((a,ai)=>`
        <div class="arow">
          <input class="input" placeholder="${t('cr_answer')} ${ai+1}" value="${escapeHtml(a.text)}"
            oninput="QS[${qi}].answers[${ai}].text=this.value">
          <input class="input" type="number" min="1" max="99" placeholder="${t('cr_points').toLowerCase()}" value="${a.points}"
            oninput="QS[${qi}].answers[${ai}].points=this.value">
          <button class="xbtn" onclick="QS[${qi}].answers.splice(${ai},1);renderQs()">✕</button>
        </div>`).join('')}
      <button class="btn btn-ghost btn-sm" style="margin-top:.4rem"
        onclick="QS[${qi}].answers.push({text:'',points:''});renderQs()">${t('cr_addans')}</button>
      <span style="font-size:.78rem;color:var(--faint);margin-left:.6rem">${t('cr_rules')}</span>
    </div>`).join('');
}

function addQuestion(){ QS.push(blankQ()); renderQs(); window.scrollTo(0,document.body.scrollHeight); }

function collect(){
  return {
    title: document.getElementById('s-title').value,
    topic: document.getElementById('s-topic').value,
    grade: document.getElementById('s-grade').value,
    language: document.getElementById('s-lang').value,
    visibility: document.getElementById('s-vis').value,
    questions: QS.map(q=>({ question:q.question,
      answers:q.answers.filter(a=>String(a.text).trim() && a.points)
                       .map(a=>({text:a.text, points:parseInt(a.points,10)})) }))
              .filter(q=>q.question.trim() && q.answers.length>=2),
  };
}

async function save(){
  const p = collect();
  if(!p.questions.length){ err(t('cr_need')); return; }
  try{
    const r = await api.post('/api/sets', p);
    ok(r.message);
    setTimeout(()=>location.href='/catalog.html', 1400);
  }catch(e){ err(e.message); }
}

// ---- JSON import ----
function loadJSON(obj){
  if(obj.title) document.getElementById('s-title').value = obj.title;
  if(obj.topic) document.getElementById('s-topic').value = obj.topic;
  if(obj.language==='cs'||obj.language==='en'){ document.getElementById('s-lang').value=obj.language; fillGrades(); }
  if(obj.grade){ const sel=document.getElementById('s-grade');
    if([...sel.options].some(o=>o.value===obj.grade)) sel.value=obj.grade;
    else { const o=document.createElement('option'); o.textContent=obj.grade; sel.appendChild(o); sel.value=obj.grade; } }
  const qs = Array.isArray(obj.questions) ? obj.questions : [];
  if(!qs.length){ err(t('cr_nojson')); return; }
  QS = qs.map(q=>({ question:String(q.question||''),
    answers:(q.answers||[]).map(a=>({text:String(a.text||''), points:a.points ?? ''})) }));
  renderQs(); ok(`${t('cr_loaded')}: ${QS.length} ${t('questions_n')}`);
}

function readFile(f){
  const r = new FileReader();
  r.onload = e => { try{ loadJSON(JSON.parse(e.target.result)); }
                    catch{ err(t('cr_badjson')); } };
  r.readAsText(f);
}
fileEl.onchange = e => e.target.files[0] && readFile(e.target.files[0]);
const drop = document.getElementById('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over');
  e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); };

function dl(name, obj){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));
  a.download=name; a.click();
}
function downloadTemplate(){
  const l = document.getElementById('s-lang').value;
  if(l==='en'){ dl('template-set.json',{ title:'My set', topic:'Vocabulary', grade:'Grade 6–7 (A1–A2)', language:'en', questions:[
    { question:'Name a pet.', answers:[
      {text:'Dog',points:40},{text:'Cat',points:32},{text:'Rabbit',points:16},{text:'Hamster',points:8}]},
    { question:'Name a fruit.', answers:[
      {text:'Apple',points:36},{text:'Banana',points:28},{text:'Orange',points:20},{text:'Strawberry',points:10}]}]}); return; }
  dl('vzor-sady.json',{ title:'Moje sada', topic:'Přírodověda', grade:'4.–5. třída', language:'cs', questions:[
    { question:'Jmenuj domácí zvíře.', answers:[
      {text:'Pes',points:40},{text:'Kočka',points:32},{text:'Králík',points:14},{text:'Křeček',points:8}]},
    { question:'Jmenuj ovoce.', answers:[
      {text:'Jablko',points:36},{text:'Banán',points:28},{text:'Hruška',points:20},{text:'Jahoda',points:10}]}]});
}
function exportCurrent(){ dl('moje-sada.json', collect()); }

(async()=>{
  await bootstrap('create');
  if(!ME || !ME.verified){ document.getElementById('gate').style.display='block'; return; }
  document.getElementById('editor').style.display='block';
  document.getElementById('s-lang').value = LANG;
  fillGrades();
  QS=[blankQ()]; renderQs();
})();
</script>
</body>
</html>
