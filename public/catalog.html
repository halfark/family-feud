<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog / Catalogue</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="brand">Family Feud</span>
  <nav class="nav" id="nav"></nav>
</div></div>

<div class="wrap" style="padding-top:1.5rem;padding-bottom:3rem">

  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title" data-i18n="cat_filter"></div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.7rem" id="filters">
      <input class="input" id="f-q" data-i18n-ph="cat_search">
      <select class="input" id="f-topic"><option value="" data-i18n="cat_topics"></option></select>
      <select class="input" id="f-grade"><option value="" data-i18n="cat_grades"></option></select>
      <select class="input" id="f-sort">
        <option value="created" data-i18n="cat_sort_new"></option>
        <option value="plays" data-i18n="cat_sort_pl"></option>
        <option value="rating" data-i18n="cat_sort_ra"></option>
        <option value="title" data-i18n="cat_sort_ti"></option>
      </select>
    </div>
    <div id="mine-row" style="margin-top:.7rem;display:none">
      <label style="font-size:.9rem;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="f-mine"> <span data-i18n="cat_mine"></span>
      </label>
    </div>
  </div>

  <div id="list"><div class="empty" data-i18n="loading"></div></div>
</div>

<!-- detail modal -->
<div class="modal-bg" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal" style="max-width:700px"><div id="detail-body"></div></div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
let SETS = [];

async function loadMeta() {
  const m = await api.get('/api/sets/meta?' + langParam());
  document.getElementById('f-topic').innerHTML =
    '<option value="" data-i18n="cat_topics"></option>' + m.topics.map(t=>`<option>${escapeHtml(t)}</option>`).join('');
  document.getElementById('f-grade').innerHTML =
    '<option value="" data-i18n="cat_grades"></option>' + m.grades.map(g=>`<option>${escapeHtml(g)}</option>`).join('');
}

async function loadSets() {
  const p = new URLSearchParams();
  p.set('lang', LANG);
  const q = document.getElementById('f-q').value.trim();
  if (q) p.set('q', q);
  const tp = document.getElementById('f-topic').value; if (tp) p.set('topic', tp);
  const g = document.getElementById('f-grade').value; if (g) p.set('grade', g);
  p.set('sort', document.getElementById('f-sort').value);
  if (document.getElementById('f-mine')?.checked) p.set('mine', '1');

  document.getElementById('list').innerHTML = `<div class="empty">${t('loading')}</div>`;
  try {
    SETS = (await api.get('/api/sets?' + p)).sets;
    render();
  } catch (e) { document.getElementById('list').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
}

function statusBadge(s) {
  if (s.status === 'pending')  return `<span class="badge grey">${t('st_pending')}</span>`;
  if (s.status === 'rejected') return `<span class="badge">${t('st_rejected')}</span>`;
  return s.visibility === 'public'
    ? `<span class="badge green">${t('st_public')}</span>`
    : `<span class="badge grey">${t('st_private')}</span>`;
}

function render() {
  const el = document.getElementById('list');
  if (!SETS.length) { el.innerHTML = `<div class="empty">${t('cat_empty')}</div>`; return; }
  el.innerHTML = `<div class="grid3">` + SETS.map(s => `
    <div class="set-card">
      <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:start">
        <div class="set-title">${escapeHtml(s.title)}</div>${statusBadge(s)}
      </div>
      <div class="set-meta">
        <span class="chip">${escapeHtml(s.topic)}</span>
        <span class="chip plain">${escapeHtml(s.grade)}</span>
        <span class="chip plain">${s.question_count} ${t('questions_n')}</span>
      </div>
      ${s.reject_reason ? `<div style="font-size:.85rem;color:var(--red-br)">${t('st_reason')}: ${escapeHtml(s.reject_reason)}</div>` : ''}
      <div style="font-size:.85rem;color:var(--muted)">${t('author')}: ${escapeHtml(s.author_name)}</div>
      <div class="set-stats">
        <span>▶ ${s.play_count}×</span>
        <span>${starsHtml(s.avg_rating, s.rating_count)}</span>
      </div>
      <div style="display:flex;gap:.4rem;margin-top:.5rem">
        <button class="btn btn-gold btn-sm" style="flex:1" onclick="playSet(${s.id})">${t('cat_play')}</button>
        <button class="btn btn-ghost btn-sm" onclick="openDetail(${s.id})">${t('cat_detail')}</button>
      </div>
    </div>`).join('') + `</div>`;
}

function playSet(id) { location.href = `/host.html?set=${id}`; }

async function openDetail(id) {
  const m = document.getElementById('detail-modal');
  m.classList.add('open');
  document.getElementById('detail-body').innerHTML = `<div class="empty">${t('loading')}</div>`;
  try {
    const { set } = await api.get('/api/sets/' + id);
    const rs = (await api.get(`/api/sets/${id}/ratings`)).ratings;
    document.getElementById('detail-body').innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:1rem;align-items:start">
        <h2 style="color:var(--gold);font-size:1.5rem">${escapeHtml(set.title)}</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeDetail()">✕</button>
      </div>
      <div class="set-meta" style="margin:.7rem 0">
        <span class="chip">${escapeHtml(set.topic)}</span>
        <span class="chip plain">${escapeHtml(set.grade)}</span>
        <span class="chip plain">${set.questions.length} ${t('questions_n')}</span>
        <span class="chip plain">▶ ${set.playCount}×</span>
      </div>
      <div style="margin-bottom:1rem">${starsHtml(set.avgRating, set.ratingCount)}</div>

      <div class="card" style="background:#0d1525;margin-bottom:1rem">
        <div class="card-title">${t('cat_qs')}</div>
        ${set.questions.map((q,i)=>`
          <div style="margin-bottom:.8rem">
            <div style="font-weight:600">${i+1}. ${escapeHtml(q.question)}</div>
            <div style="font-size:.85rem;color:var(--muted);padding-left:1rem">
              ${q.answers.map(a=>`${escapeHtml(a.text)} <span style="color:var(--gold)">${a.points}</span>`).join(' · ')}
            </div>
          </div>`).join('')}
      </div>

      ${ME ? renderRatingForm(set) : `<p style="color:var(--muted);font-size:.9rem">
        <a href="#" onclick="closeDetail();openAuth('login');return false">${t('au_log_here')}</a> ${t('cat_login_rate')}</p>`}

      ${rs.length ? `<div class="card" style="background:#0d1525;margin-top:1rem">
        <div class="card-title">${t('cat_comments')}</div>
        ${rs.map(r=>`<div style="border-bottom:1px solid var(--line);padding:.5rem 0">
          <div><span class="stars">${'★'.repeat(r.stars)}</span>
          <strong style="font-size:.9rem"> ${escapeHtml(r.display_name)}</strong>
          <span style="font-size:.8rem;color:var(--faint)"> ${fmtDate(r.created_at)}</span></div>
          <div style="font-size:.9rem;color:var(--muted);font-family:Barlow,sans-serif">${escapeHtml(r.comment)}</div>
        </div>`).join('')}</div>` : ''}

      <div style="display:flex;gap:.5rem;margin-top:1.2rem">
        <button class="btn btn-gold" style="flex:1" onclick="playSet(${set.id})">${t('cat_start')}</button>
        ${set.isOwner ? `<button class="btn btn-red btn-sm" onclick="delSet(${set.id})">${t('delete')}</button>` : ''}
      </div>`;
  } catch (e) {
    document.getElementById('detail-body').innerHTML =
      `<div class="empty">${escapeHtml(e.message)}</div>
       <button class="btn btn-ghost" onclick="closeDetail()">${t('close')}</button>`;
  }
}

function renderRatingForm(set) {
  const cur = set.myRating;
  return `<div class="card" style="background:#0d1525">
    <div class="card-title">${cur ? t('cat_rerate') : t('cat_rate')}</div>
    <div id="star-pick" style="font-size:2rem;letter-spacing:4px;cursor:pointer;margin-bottom:.6rem">
      ${[1,2,3,4,5].map(n=>`<span onclick="setStars(${n})" data-n="${n}"
        style="color:${cur && n<=cur.stars ? 'var(--gold)':'var(--faint)'}">★</span>`).join('')}
    </div>
    <textarea class="input" id="rate-comment" placeholder="${t('cat_comm_ph')}"
      >${escapeHtml(cur?.comment || '')}</textarea>
    <button class="btn btn-gold btn-sm" style="margin-top:.6rem" onclick="submitRating(${set.id})">${t('cat_send_rate')}</button>
  </div>`;
}

let pickedStars = 0;
function setStars(n) {
  pickedStars = n;
  document.querySelectorAll('#star-pick span').forEach(s => {
    s.style.color = (+s.dataset.n <= n) ? 'var(--gold)' : 'var(--faint)';
  });
}

async function submitRating(id) {
  const stars = pickedStars || document.querySelectorAll('#star-pick span[style*="gold"]').length;
  if (!stars) { err(t('cat_pick_star')); return; }
  try {
    await api.post(`/api/sets/${id}/rating`, {
      stars, comment: document.getElementById('rate-comment').value });
    ok(t('cat_rated'));
    pickedStars = 0;
    openDetail(id); loadSets();
  } catch (e) { err(e.message); }
}

async function delSet(id) {
  if (!confirm(t('cat_del_conf'))) return;
  try { await api.del('/api/sets/' + id); ok(t('cat_deleted')); closeDetail(); loadSets(); }
  catch (e) { err(e.message); }
}

function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); pickedStars = 0; }

(async () => {
  await bootstrap('catalog');
  if (ME) document.getElementById('mine-row').style.display = 'block';
  await loadMeta();
  await loadSets();
  let tmr;
  document.getElementById('f-q').oninput = () => { clearTimeout(tmr); tmr = setTimeout(loadSets, 350); };
  ['f-topic','f-grade','f-sort','f-mine'].forEach(id => {
    const el = document.getElementById(id); if (el) el.onchange = loadSets;
  });
})();
</script>
</body>
</html>
