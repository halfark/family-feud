<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statistiky / Statistics</title>
<link rel="stylesheet" href="/style.css">
<style>
  .bar{height:22px;background:linear-gradient(90deg,var(--gold-dk),var(--gold));border-radius:3px;min-width:2px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:90px;padding:.6rem 0}
  .spark div{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .spark div:hover{opacity:1}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="brand">Family Feud</span><span class="badge gold" data-i18n="nav_stats"></span>
  <nav class="nav" id="nav"></nav>
</div></div>

<div class="wrap" style="padding-top:1.5rem;padding-bottom:3rem">
  <div class="metrics" id="metrics" style="margin-bottom:1.5rem"></div>

  <div class="grid2" style="align-items:start">
    <div class="card">
      <div class="card-title" data-i18n="stt_top"></div>
      <div id="top"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div class="card">
        <div class="card-title" data-i18n="stt_topics"></div>
        <div id="topics"></div>
      </div>
      <div class="card">
        <div class="card-title" data-i18n="stt_30d"></div>
        <div class="spark" id="spark"></div>
        <div id="sparklbl" style="font-size:.78rem;color:var(--faint);text-align:center"></div>
      </div>
    </div>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
(async()=>{
  await bootstrap('stats');
  const st = await api.get('/api/stats');
  const tt = st.totals;

  document.getElementById('metrics').innerHTML = [
    [t('stt_sets'), tt.sets_approved], [t('stt_plays'), tt.total_plays],
    [t('stt_users'), tt.users], [t('stt_rating'), tt.avg_rating ? tt.avg_rating.toFixed(2)+' ★' : '—'],
  ].map(([l,v])=>`<div class="metric"><div class="m-lbl">${l}</div><div class="m-val">${v ?? 0}</div></div>`).join('');

  const max = Math.max(1, ...st.top.map(s=>s.play_count));
  document.getElementById('top').innerHTML = st.top.length ? st.top.map((s,i)=>`
    <div style="margin-bottom:.8rem">
      <div style="display:flex;justify-content:space-between;gap:.6rem;font-size:.95rem;margin-bottom:.25rem">
        <span><span style="color:var(--gold);font-family:'Bebas Neue';font-size:1.15rem">${i+1}.</span>
          <a href="/host.html?set=${s.id}">${escapeHtml(s.title)}</a>
          <span style="color:var(--faint);font-size:.82rem">${escapeHtml(s.grade)}</span></span>
        <span style="color:var(--gold);white-space:nowrap">${s.play_count}×</span>
      </div>
      <div class="bar" style="width:${Math.round(s.play_count/max*100)}%"></div>
      <div style="font-size:.8rem;margin-top:.2rem">${starsHtml(s.avg_rating,s.rating_count)}</div>
    </div>`).join('') : `<div class="empty">${t('stt_none')}</div>`;

  const mt = Math.max(1, ...st.byTopic.map(r=>r.plays||0));
  document.getElementById('topics').innerHTML = st.byTopic.map(r=>`
    <div style="margin-bottom:.6rem">
      <div style="display:flex;justify-content:space-between;font-size:.9rem">
        <span>${escapeHtml(r.topic)} <span style="color:var(--faint)">(${r.sets} ${t('stt_sets_w')})</span></span>
        <span style="color:var(--gold)">${r.plays||0}×</span></div>
      <div class="bar" style="width:${Math.round((r.plays||0)/mt*100)}%;height:8px"></div>
    </div>`).join('') || '<div class="empty">—</div>';

  const days = {};
  for(let i=29;i>=0;i--){
    const d = new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    days[d]=0;
  }
  st.recent.forEach(r=>{ if(r.d in days) days[r.d]=r.c; });
  const vals = Object.values(days), mx = Math.max(1,...vals);
  document.getElementById('spark').innerHTML = Object.entries(days).map(([d,c])=>
    `<div style="height:${Math.max(2,Math.round(c/mx*100))}%" title="${d}: ${c}×"></div>`).join('');
  document.getElementById('sparklbl').textContent =
    `${t('stt_total')} ${vals.reduce((a,b)=>a+b,0)} ${t('stt_games')} · ${t('stt_max')} ${mx} ${t('stt_perday')}`;
})();
</script>
</body>
</html>
