name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t family-feud:ci .

      - name: Start container
        run: |
          mkdir -p "$RUNNER_TEMP/feud-data"
          docker run -d --name feud \
            -p 3000:3000 \
            -e JWT_SECRET=ci-secret \
            -e PUBLIC_URL=http://localhost:3000 \
            -v "$RUNNER_TEMP/feud-data:/data" \
            family-feud:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Server je nahoře."; exit 0
            fi
            sleep 2
          done
          echo "Server nenaběhl:"; docker logs feud; exit 1

      - name: Verify seeded content
        run: |
          curl -fsS http://localhost:3000/api/sets/meta | tee /tmp/meta.json
          node -e "
            const m = require('/tmp/meta.json');
            if (!(m.counts.cs > 0 && m.counts.en > 0))
              throw new Error('Chybí naseedované sady: ' + JSON.stringify(m.counts));
            console.log('OK – cs:', m.counts.cs, 'en:', m.counts.en);
          "

      - name: Verify data survives restart
        run: |
          docker restart feud
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health > /dev/null && break
            sleep 2
          done
          curl -fsS "http://localhost:3000/api/sets?lang=en" \
            | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                const n=JSON.parse(d).sets.length;
                if(!n) throw new Error('Po restartu zmizela data!');
                console.log('OK – po restartu stále', n, 'anglických sad');
              });"

      - name: Container logs on failure
        if: failure()
        run: docker logs feud
